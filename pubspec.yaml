name: grocery_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.3.2
  
  ## -- STATE MANAGEMENT
  get: ^4.6.6
  get_storage: ^2.1.1

  ## -- FIREBASE PACKAGES
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  google_sign_in: ^7.2.0




  ## -- OnBoarding PACKAGES
  liquid_swipe: ^3.1.0
  smooth_page_indicator: ^1.2.1

 ## -- ICON PACKAGES
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8
  line_awesome_flutter: ^3.0.1
  
  ## -- Utility PACKAGES
  intl: ^0.20.2
  logger: ^2.6.2
  lottie: ^3.3.2
  badges: ^3.1.2
  shimmer: ^3.0.0
  readmore: ^3.0.0
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  carousel_slider: ^5.1.1
  connectivity_plus: ^7.0.0
  country_code_picker: ^3.4.1
  flutter_native_splash: ^2.4.7

  http: any

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding_img/onboarding_type_1/
    - assets/images/onboarding_img/onboarding_type_2/
    - assets/images/onboarding_img/onboarding_type_3/
    - assets/images/splash-img/
    - assets/images/auth/
    - assets/icons/
    - assets/fonts/
    - assets/images/home/
    - assets/images/home/icons/
    - assets/images/home/products/
    - assets/images/product_details/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500  
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600 
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700